<div class="tabgroup__container">
  <div class="tabgroup__header">
    @for (tab of tabs(); track tab) {
      <div class="tabgroup-header__tab-item">
        <lib-tab
          [title]="tab.title"
          [section]="tab.section"
          [selectedSection]="selectedTabsection()"
          (selectSection)="selectedTabsection.set($event)"
        ></lib-tab>
      </div>
    }
  </div>
  <router-outlet></router-outlet>
</div>
