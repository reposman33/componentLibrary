<div class="tabgroup__container">
  <div class="tabgroup__header">
    @for (tab of tabs; track tab) {
      <div class="tabgroup-header__tab-item">
        <lib-tab
          [title]="tab.title"
          [section]="tab.section"
          (select)="selectTab(tab.title)"
          [selectedTab]="selectedTab"
        ></lib-tab>
      </div>
    }
  </div>
  <router-outlet></router-outlet>
</div>
